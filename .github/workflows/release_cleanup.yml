name: Release Cycle Automation

on:
  release:
    types: [published]

jobs:
  cycle_release:
    runs-on: ubuntu-latest
    steps:
      - name: Close Milestone & Shift Future Cards
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            // 1. Close active milestone
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            if (milestones.data.length > 0) {
              await github.rest.issues.updateMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: milestones.data[0].number,
                state: 'closed'
              });
            }

            // 2. Fetch Project Data to shift "Future" -> "Next Release"
            const projectNumber = 7; 
            const owner = context.repo.owner;

            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const projRes = await github.graphql(projectQuery, { owner, number: projectNumber });
            const project = projRes.user.projectV2;
            const statusField = project.field;
            
            const nextReleaseOption = statusField.options.find(o => o.name === 'Next Release');
            if (!nextReleaseOption) return;

            // Find all items currently in the "Future" column
            const futureItems = project.items.nodes.filter(item => 
              item.fieldValueByName && item.fieldValueByName.name === 'Future'
            );

            // Mutate them to "Next Release"
            const mutateQuery = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) { clientMutationId }
              }
            `;

            for (const item of futureItems) {
              await github.graphql(mutateQuery, {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: nextReleaseOption.id
              });
              console.log(`Shifted Item ID ${item.id} to Next Release`);
            }
