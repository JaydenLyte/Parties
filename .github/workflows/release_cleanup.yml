name: Release Cycle Automation

on:
  release:
    types: [published]

jobs:
  close_and_rotate_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Close Milestone and Shift Future Issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            // 1. Close the active open milestone
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            if (milestones.data.length > 0) {
              const activeMilestone = milestones.data[0];
              await github.rest.issues.updateMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: activeMilestone.number,
                state: 'closed'
              });
              console.log(`Closed Milestone: ${activeMilestone.title}`);
            }

            // 2. Query issues labeled 'progress: future' and promote them to 'progress: next'
            const futureIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'progress: future'
            });

            for (const issue of futureIssues.data) {
              // Swap labels
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'progress: future'
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['progress: next']
              });

              console.log(`Promoted Issue #${issue.number} from Future to Next Release.`);
            }
