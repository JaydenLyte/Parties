name: Auto-Milestone on Column Change

on:
  projects_v2_item:
    types: [created, edited]

jobs:
  assign_milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Attach Milestone
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            // Get the node ID of the project item that was moved
            const itemId = context.payload.projects_v2_item.node_id;
            const projectId = context.payload.projects_v2_item.project_node_id;
            
            // Query the item's current status and associated issue number
            const query = `
              query($itemId: ID!) {
                node(id: $itemId) {
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        number
                        milestone { id }
                      }
                    }
                    fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue {
                        name
                      }
                    }
                  }
                }
              }
            `;
            
            const res = await github.graphql(query, { itemId });
            const item = res.node;
            
            if (!item.content || !item.fieldValueByName || item.content.milestone) return;
            
            const status = item.fieldValueByName.name;
            const activeStatuses = ['Next Release', 'In Progress', 'Testing'];
            
            if (activeStatuses.includes(status)) {
              // Fetch the active open milestone
              const milestones = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                sort: 'due_on',
                direction: 'asc'
              });
              
              let targetMilestoneNumber;
              
              if (milestones.data.length > 0) {
                targetMilestoneNumber = milestones.data[0].number;
              } else {
                // Lazy initialization: Create a default milestone if none exists
                const newMilestone = await github.rest.issues.createMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'Next Release' // You can change this default name
                });
                targetMilestoneNumber = newMilestone.data.number;
                console.log('No open milestone found. Generated fallback: Next Release');
              }
              
              // Attach the resolved milestone to the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.content.number,
                milestone: targetMilestoneNumber
              });
              
              console.log(`Attached Milestone #${targetMilestoneNumber} to Issue #${item.content.number}`);
            }
